<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="BizTrack Project by Sumayyah"/>
    <meta property="og:description" content="A project born out of real small business challenges, now simplifying product, order, and finance management."/>
    <meta property="og:image:secure_url" content="https://i.imgur.com/0O47fVi.jpg"/>
    <meta property="og:url" content="https://sumusa.github.io/biztrack/"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator.min.css"/>
    <link rel="stylesheet" href="/styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <title>{{ t("documentTitle") }}</title>
</head>
<body data-i18n-page="expenses">
    <div id="sidebar" class="sidebar">
        <div class="logo">
            <a href="/index.html">
                <i class="fas fa-b"></i>
                <span>BizTrack</span>
            </a>
            <i class="fa-solid fa-xmark" title="{{ t('common.Close') }}" onclick="closeSidebar()"></i>
        </div>
        <ul class="menu">
            <li>
                <a href="/index.html">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>{{ t("common.Dashboard") }}</span>
                </a>
            </li>
            <li>
                <a href="/products.html">
                    <i class="fas fa-dolly"></i>
                    <span>{{ t("common.Products") }}</span>
                </a>
            </li>
            <li>
                <a href="/orders.html">
                    <i class="fas fa-shopping-cart"></i>
                    <span>{{ t("common.Orders") }}</span>
                </a>
            </li>
            <li class="active">
                <a href="/finances.html">
                    <i class="fas fa-sack-dollar"></i>
                    <span>{{ t("common.Expenses") }}</span>
                </a>
            </li>
            <li>
                <a href="/help.html">
                    <i class="fas fa-question-circle"></i>
                    <span>{{ t("common.Help") }}</span>
                </a>
            </li>
            <li class="logout">
                <a href="/about.html">
                    <i class="fa-solid fa-users-line"></i>
                    <span>{{ t("common.Meet the Developer") }}</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-wrapper">
            <div class="menu-icon" onclick="openSidebar()">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="header-title">
                <!-- <span>Primary</span> -->
                <h2>{{ t("title") }}</h2>
            </div>
            <div class="user-info">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="search" id="searchInput" placeholder="{{ t('common.Search') }}">
                </div>
                <!-- <i class="fas fa-user-alt fa-xl"></i> -->
            </div>
        </div>

        <div class="table-wrapper">
            <div class="product-title">
                <h3 class="main-title">{{ t("title") }}</h3>
                <div class="finance-button">
                    <button class="add-button" onclick="openForm()">{{ t("addExpense") }}</button>
                    <button class="download-button" onclick="exportToCSV()">{{ t("exportCSV") }}</button>
                </div>
            </div>

            <div class="form-popup">
                <form class="form-container" id="transaction-form" onsubmit="addOrUpdate(event)">
                    <div class="form-columns">
                            <input type="hidden" id="tr-id">
                            <label for="tr-date"><b>{{ t("common.Date:") }} </b></label>
                            <input type="date" id="tr-date" required>

                            <label for="tr-category"><b>{{ t("common.Category:") }} </b></label>
                            <select name="tr-category" id="tr-category" required>
                                <option value="" disabled selected hidden>{{ t("common.Choose an expense category") }}</option>
                                <option value="Rent">{{ t("common.Rent") }}</option>
                                <option value="Utilities">{{ t("common.Utilities") }}</option>
                                <option value="Supplies">{{ t("common.Supplies") }}</option>
                                <option value="Order Fulfillment">{{ t("common.Order Fulfillment") }}</option>
                                <option value="Miscellaneous">{{ t("common.Miscellaneous") }}</option>
                            </select>

                            <label for="tr-amount"><b>{{ t("common.Amount:") }} </b></label>
                            <input type="number" id="tr-amount" placeholder="$0.00" min="0.00" max="10000.00" step="0.01" required>

                            <label for="tr-notes"><b>{{ t("common.Notes:") }} </b></label>
                            <input type="text" id="tr-notes" placeholder="{{ t('common.Power bill') }}" required>
                    </div>
                    
                    <div class="button-col">
                        <button type="submit" class="btn" id="submitBtn">{{ t("common.Add") }}</button>
                        <button type="button" class="btn cancel" onclick="closeForm()">{{ t("common.Cancel") }}</button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div id="finance-table" class="biztrack-data-table"></div>
                <div class="table-total" id="total-expenses"></div>
            </div>
        </div>
    </div>
    </div>
    <script src="/app-core.js"></script>
    <script src="/i18n.js"></script>
    <script src="/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <script src="/data-table.js"></script>
    <script src="/repository.js"></script>
    <script src="/validation-pipeline.js"></script>

    <script src="/finances.js"></script>
</body>
</html>
