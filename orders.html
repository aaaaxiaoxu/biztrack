<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="BizTrack Project by Sumayyah"/>
    <meta property="og:description" content="A project born out of real small business challenges, now simplifying product, order, and finance management."/>
    <meta property="og:image:secure_url" content="https://i.imgur.com/0O47fVi.jpg"/>
    <meta property="og:url" content="https://sumusa.github.io/biztrack/"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator.min.css"/>
    <link rel="stylesheet" href="/styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <title>{{ t("documentTitle") }}</title>
</head>
<body data-i18n-page="orders">
    <div id="sidebar" class="sidebar">
        <div class="logo">
            <a href="/index.html">
                <i class="fas fa-b"></i>
                <span>BizTrack</span>
            </a>
            <i class="fa-solid fa-xmark" title="{{ t('common.Close') }}" data-sidebar-close></i>
        </div>
        <ul class="menu">
            <li>
                <a href="/index.html">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>{{ t("common.Dashboard") }}</span>
                </a>
            </li>
            <li>
                <a href="/products.html">
                    <i class="fas fa-dolly"></i>
                    <span>{{ t("common.Products") }}</span>
                </a>
            </li>
            <li class="active">
                <a href="/orders.html">
                    <i class="fas fa-shopping-cart"></i>
                    <span>{{ t("common.Orders") }}</span>
                </a>
            </li>
            <li>
                <a href="/finances.html">
                    <i class="fas fa-sack-dollar"></i>
                    <span>{{ t("common.Expenses") }}</span>
                </a>
            </li>
            <li>
                <a href="/help.html">
                    <i class="fas fa-question-circle"></i>
                    <span>{{ t("common.Help") }}</span>
                </a>
            </li>
            <li class="logout">
                <a href="/about.html">
                    <i class="fa-solid fa-users-line"></i>
                    <span>{{ t("common.Meet the Developer") }}</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-wrapper">
            <div class="menu-icon" data-sidebar-toggle>
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="header-title">
                <!-- <span>Primary</span> -->
                <h2>{{ t("title") }}</h2>
            </div>
            <div class="user-info">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="search" id="searchInput" placeholder="{{ t('common.Search') }}">
                </div>
                <!-- <i class="fas fa-user-alt fa-xl"></i> -->
            </div>
        </div>

        <div class="table-wrapper">
            <div class="product-title">
                <h3 class="main-title">{{ t("title") }}</h3>
                <div class="order-button">
                    <button type="button" class="add-button" data-form-open>{{ t("addOrder") }}</button>
                    <button type="button" class="download-button" data-export-csv>{{ t("exportCSV") }}</button>
                </div>
            </div>

            <div class="form-popup">
                <form class="form-container" id="order-form">
                    <div class="form-columns">

                        <div class="order-first-col">
                            <label for="order-id"><b>{{ t("common.Order ID:") }} </b></label>
                            <input type="text" id="order-id" placeholder="1001" required>

                            <label for="order-date"><b>{{ t("common.Order Date:") }} </b></label>
                            <input type="date" id="order-date" required>

                            <label for="item-name"><b>{{ t("common.Item Name:") }} </b></label>
                            <select name="item-name" id="item-name" required>
                                <option value="" disabled selected hidden>{{ t("common.Choose an item") }}</option>
                                <optgroup label="Hats">
                                    <option value="Baseball caps">{{ t("common.Baseball caps") }}</option>
                                    <option value="Snapbacks">{{ t("common.Snapbacks") }}</option>
                                    <option value="Beanies">{{ t("common.Beanies") }}</option>
                                    <option value="Bucket hats">{{ t("common.Bucket hats") }}</option>
                                </optgroup>
                                <optgroup label="Drinkware">
                                    <option value="Mugs">{{ t("common.Mugs") }}</option>
                                    <option value="Water bottles">{{ t("common.Water bottles") }}</option>
                                    <option value="Tumblers">{{ t("common.Tumblers") }}</option>
                                </optgroup>   
                                <optgroup label="Clothing">
                                    <option value="T-shirts">{{ t("common.T-shirts") }}</option>
                                    <option value="Sweatshirts">{{ t("common.Sweatshirts") }}</option>
                                    <option value="Hoodies">{{ t("common.Hoodies") }}</option>
                                </optgroup>   
                                <optgroup label="Accessories">
                                    <option value="Pillow cases">{{ t("common.Pillow cases") }}</option>
                                    <option value="Tote bags">{{ t("common.Tote bags") }}</option>
                                    <option value="Stickers">{{ t("common.Stickers") }}</option>
                                </optgroup>   
                                <optgroup label="Home decor">
                                    <option value="Posters">{{ t("common.Posters") }}</option>
                                    <option value="Framed posters">{{ t("common.Framed posters") }}</option>
                                    <option value="Canvas prints">{{ t("common.Canvas prints") }}</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="order-second-col">
                            <label for="item-price"><b>{{ t("common.Item Price:") }}</b></label>
                            <input type="number" id="item-price" placeholder="$0.00" min="0.00" max="10000.00" step="0.01" required>

                            <label for="qty-bought"><b>{{ t("common.Quantity Bought:") }}</b></label>
                            <input type="number" id="qty-bought" placeholder="1" required>

                            <label for="shipping"><b>{{ t("common.Shipping fee:") }}</b></label>
                            <input type="number" id="shipping" placeholder="$2.00" min="0.00" max="10000.00" step="0.01" required>
                        </div>

                        <div class="order-third-col">
                            <label for="taxes"><b>{{ t("common.Taxes (VAT/GST/HST):") }}</b></label>
                            <input type="number" id="taxes" placeholder="$2.00" min="0.00" max="10000.00" step="0.01" required>

                            <label for="order-status"><b>{{ t("common.Order Status:") }}</b></label>
                            <select name="order-status" id="order-status" required>
                                <option value="" disabled selected hidden>{{ t("common.Choose a status") }}</option>
                                <option value="Pending" class="pending">{{ t("common.Pending") }}</option>
                                <option value="Processing" class="processing">{{ t("common.Processing") }}</option>
                                <option value="Shipped" class="shipped">{{ t("common.Shipped") }}</option>
                                <option value="Delivered" class="delivered">{{ t("common.Delivered") }}</option>
                            </select>

                            <label for="order-total"><b>{{ t("common.Total Order Amount:") }} <small>{{ t("common.(Calculated)") }}</small></b></label>
                            <input type="number" id="order-total" placeholder="$0.00" min="0.00" max="10000.00" step="0.01" disabled>
                        </div>
                    </div>
                    
                    <div class="button-col">
                        <button type="submit" class="btn" id="submitBtn">{{ t("common.Add") }}</button>
                        <button type="button" class="btn cancel" data-form-close>{{ t("common.Cancel") }}</button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div id="order-table" class="biztrack-data-table"></div>
                <div class="table-total" id="total-revenue"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <script type="module" src="/orders.ts"></script>
</body>
</html>
